[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pdf-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for the AI PDF Chatbot"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "openai>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "tiktoken>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "../.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
